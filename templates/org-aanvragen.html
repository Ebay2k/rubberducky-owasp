<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Onderzoek overzicht</title>
</head>

<body>
<center>
<h1>Onderzoek aanvragen</h1>
</center>
    {%for form in forms%}
        <br>
        <h2>Organisatie ID: {{ form.organization_id }}</h2>
        <p>Onderzoek: {{ form.title }}</p>
        <p>Status: {{ form.status }}</p>
        <p>Beschikbaar: {{ "Beschikbaar" if form.available else "Nee" }}</p>
        <p>Beschrijving: {{ form.description }}</p>
        <p></p>
    {%endfor%}

</body>
</html>
