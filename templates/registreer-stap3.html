<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Registreren - Stap 3</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard-ev.css') }}">
</head>
<body>
{% extends 'layout.html' %}
{% block content %}

<div class="container">
    <a href="{{ url_for('registreer_stap2') }}" class="back-link">← Terug</a>

    <div class="detail-card">
        <div class="detail-header">
            <h1 class="detail-title">Registreren als Ervaringsdeskundige</h1>
            <p class="detail-organization">Stap 3 van 4: Toezichthouder</p>
        </div>

        <form method="POST" class="detail-content">
            <section class="detail-section">
                <h2>Gegevens Voogd/Begeleider</h2>
                <div class="detail-info-grid">
                    <div class="detail-info-item">
                        <label class="detail-label" for="guardian_name">Naam *</label>
                        <input type="text" id="guardian_name" name="guardian_name" class="detail-value" required>
                    </div>

                    <div class="detail-info-item">
                        <label class="detail-label" for="guardian_email">E-mailadres *</label>
                        <input type="email" id="guardian_email" name="guardian_email" class="detail-value" required>
                    </div>

                    <div class="detail-info-item">
                        <label class="detail-label" for="guardian_phone">Telefoonnummer *</label>
                        <input type="tel" id="guardian_phone" name="guardian_phone" class="detail-value" required>
                    </div>
                </div>
            </section>

            <section class="detail-section enrollment-section">
                <button type="submit" class="enroll-button-large">
                    Volgende stap →
                </button>
            </section>
        </form>
    </div>
</div>

{% endblock %}
</body>
</html>
