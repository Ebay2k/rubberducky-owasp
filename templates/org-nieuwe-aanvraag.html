<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Nieuw onderzoek aanmaken</title>
    <link rel="stylesheet" href="../static/org-edit.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 mb-5" aria-label="Hoofdnavigatie">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Accessibility</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Wissel navigatie">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="/dashboard-org">Home</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-sm btn-outline-dark" href="/">Uitloggen</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

  <h1 class="header-text">Nieuw onderzoek aanmaken:</h1>

  <form method = "post">
    <label class = "text-container">
      <span class = "label_text">
        Onderzoeksnaam:
      </span>
      <input type = "text" name = "title" placeholder="Type hier de naam van het onderzoek."
             required class="input-naam">
    </label>
    <br><br>

    <label class="text-container">
      <span class = "label_text">
        Beschrijving:
      </span>
      <input type="text" name="description" placeholder="Type hier een korte beschrijving van het onderzoek."
             required class="input-beschrijving">
    </label>
    <br><br>

    <label class="text-container">
      <span class = "label_text">
        Beloning:
      </span>
      <input type="text" name="reward" placeholder="Type kort een beloning. (Dit veld is optioneel.)"
             class="input-beschrijving">
    </label>
    <br><br>

    <button type = "submit" class="submit-knop">Nieuw Onderzoek Bevestigen?</button>
    <a href="{{ url_for('org_aanvragen') }}" class="annuleren-knop">Annuleren</a>

  </form>
</body>
</html>
