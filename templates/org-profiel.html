<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Profiel gegevens</title>
    <link rel="stylesheet" href="../static/org-profiel.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 mb-5" aria-label="Hoofdnavigatie">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Accessibility</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Wissel navigatie">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="/dashboard-org">Home</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-sm btn-outline-dark" href="/">Uitloggen</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

<div class="header-container">
    <h1 class="header-text">Organisatieprofiel wijzigen</h1>
</div>

<form method="POST" class="text-container">
    <label class="text-container">
        E-mail: <input type="email" name="email"
                    value="{{ organization.email }}" class="input-short-text"required>
    </label>
    <br><br>

    <label class="text-container">
        Telefoon nummer: <input type="tel" name="phone"
                    value="{{ organization.phone }}" required>
    </label>
    <br><br>

    <label class="text-container">
        Website: <input type="url" name="website"
                    value="{{ organization.website }}">
    </label>
    <br><br>

    <label class="text-container">
        Type organisatie:
        <select name="type" required>
            <option value="non-profit"  {% if organization.type == "non-profit" %}selected{% endif %}>
            Non-profit</option>

            <option value="commercieel"  {% if organization.type == "commercieel" %}selected{% endif %}>
                Commercieel</option>
        </select>
    </label>
    <br><br>

    <label class="text-container">
        Beschrijving: <input name="description" value="{{ organization.description }}" class="input-long-text"required>
    </label>
    <br><br>

    <button type="submit" class="submit-knop">Wijzigingen opslaan?</button>
    <a href="{{ url_for('org_aanvragen') }}" class="annuleren-knop">Annuleren</a>

</form>

</body>
</html>
