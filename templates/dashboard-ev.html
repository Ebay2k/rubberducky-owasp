<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Ervaringsdeskundige - RubberDucky</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 mb-5" aria-label="Hoofdnavigatie">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Accessibility</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Wissel navigatie">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="/">Home</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-sm btn-outline-dark" href="/">Uitloggen</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center mb-5">
                <h1 class="display-6 fw-bold text-dark">Dashboard Ervaringsdeskundige</h1>
                <p class="text-secondary">Welkom terug. Wat wilt u vandaag doen?</p>
            </div>
        </div>

        <div class="row g-4 justify-content-center">
            <!-- Aanvragen Card -->
            <div class="col-md-5 col-lg-4">
                <a href="ev-aanvragen" class="text-decoration-none card-link">
                    <div class="card shadow-sm h-100 py-4 px-3 text-center bg-white">
                        <div class="card-body">
                            <!-- Changed to h2 for logical hierarchy after h1 -->
                            <h2 class="h5 card-title text-dark">Aanvragen Bekijken</h2>
                            <p class="card-text text-secondary small mt-2">Bekijk openstaande verzoeken en statusupdates.</p>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Profiel Card -->
            <div class="col-md-5 col-lg-4">
                <a href="ev-profiel" class="text-decoration-none card-link">
                    <div class="card shadow-sm h-100 py-4 px-3 text-center bg-white">
                        <div class="card-body">
                            <!-- Changed to h2 for logical hierarchy after h1 -->
                            <h2 class="h5 card-title text-dark">Profiel Gegevens</h2>
                            <p class="card-text text-secondary small mt-2">Beheer uw persoonlijke informatie en instellingen.</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
